<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Plataforma de Gestão Territorial</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/leaflet.css?v=3.0">
    <link rel="stylesheet" href="css/qgis2web.css?v=3.0">
    
    <style>
        :root { --verde-escuro: #0f6c37; --amarelo-ouro: #f8cc23; --glass-bg: rgba(255, 255, 255, 0.9); }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* ESTRUTURA DE CAMADAS */
        .page-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 10; background: #f4f6f4; }
        #welcome-screen { background: url('fundo-coprodia.png') center/cover; z-index: 20; }
        #map-screen { display: none; }
        #map-screen.active { display: flex; }
        
        /* CABEÇALHOS E RODAPÉS */
        .app-header { height: 80px; width: 100%; background: rgba(255,255,255,0.95); border-bottom: 4px solid var(--verde-escuro); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-sizing: border-box; }
        .app-footer { height: 50px; width: 100%; background: rgba(0,0,0,0.6); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        
        /* DASHBOARD */
        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; width: 100%; max-width: 1200px; }
        .market-card { background: var(--glass-bg); padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; }

        /* MAPA */
        #map { flex: 1; width: 100%; }
        
        /* MOBILIDADE */
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div id="welcome-screen" class="page-layer">
        <header class="app-header">
            <h1 style="color:var(--verde-escuro); margin:0;">Plataforma de Gestão Territorial</h1>
        </header>
        <main class="main-content">
            <div class="dashboard-grid">
                <div class="market-card" id="card-boi"><div class="card-label">Boi Gordo</div><div class="card-value" id="val-boi">--</div></div>
                </div>
        </main>
        <footer class="app-footer">Desenvolvido por Montijo &copy; 2026</footer>
    </div>

    <div id="map-screen" class="page-layer">
        <header class="app-header">
            <h1 style="color:var(--verde-escuro); margin:0; cursor:pointer;" onclick="retornarParaHome()">Plataforma de Gestão Territorial</h1>
            <button onclick="retornarParaHome()">Voltar para Home</button>
        </header>
        <div id="map"></div>
        <footer class="app-footer">Rodapé do Mapa</footer>
    </div>

    <script>
        // Funções de Navegação
        function entrarNoMapa() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('map-screen').classList.add('active');
            map.invalidateSize();
        }
        function retornarParaHome() {
            document.getElementById('welcome-screen').style.display = 'flex';
            document.getElementById('map-screen').classList.remove('active');
        }
    </script>
    
    </body>
</html>
