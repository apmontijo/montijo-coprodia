<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                font-family: sans-serif;
            }

            /* Configuração do Cabeçalho Transparente */
            .custom-header {
                width: 100%;
                background: transparent; /* Sem fundo */
                border-bottom: 2px solid #004d26; /* Linha de separação verde */
                padding: 12px 20px; /* Espaçamento interno para proteger a logo */
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                z-index: 1000; /* Garante que fique sobre o mapa se necessário */
            }

            .header-logo {
                height: auto;
                max-height: 75px; /* Ajusta o tamanho da imagem proporcionalmente */
                display: block;
                margin-bottom: 4px; /* Afasta a logo da linha para não sobrepor */
            }

            /* Container do Mapa ajustado para ocupar o restante da tela */
            #map {
                width: 100%;
                flex: 1;
                margin: 0;
                padding: 0;
                z-index: 1;
            }
        </style>
        <title>Plataforma de Gestão Territorial - Montijo</title>
    </head>
    <body>
        <header class="custom-header">
            <img src="logo-montijo.jpg" alt="Montijo - Plataforma de Gestão Territorial" class="header-logo">
        </header>

        <div id="map">

        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="data/2026_COPRODIA_BASE_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-14.815,-58.514],[-14.124,-57.102]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

</html>
