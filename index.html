<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Painel Interativo Coprodia</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/leaflet.css?v=3.0">
    <link rel="stylesheet" href="css/qgis2web.css?v=3.0">
    
    <style>
        :root {
            --verde-escuro: #0f6c37;
            --verde-claro: #5cb85c;
            --amarelo-ouro: #f8cc23;
            --glass-bg: rgba(255, 255, 255, 0.9);
        }

        /* Estrutura Base */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #app-container { display: flex; flex-direction: column; height: 100vh; width: 100%; }

        /* --- TELA DE BOAS-VINDAS --- */
        #welcome-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('fundo-coprodia.png') no-repeat center center;
            background-size: cover;
            z-index: 9999;
            display: flex; flex-direction: column;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* --- CABEÇALHOS --- */
        .cabecalho {
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 4px solid var(--verde-escuro); background: rgba(255, 255, 255, 0.95);
            width: 100%; box-sizing: border-box; z-index: 2000;
        }

        /* --- DASHBOARD --- */
        .dashboard-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; }
        .market-card { background: var(--glass-bg); padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* --- MAPA --- */
        #map-wrapper { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; }
        #map { flex: 1; width: 100%; }

        /* --- RODAPÉ --- */
        .footer {
            background: rgba(0, 0, 0, 0.7); color: white; text-align: center;
            padding: 10px; font-size: 0.8rem; width: 100%;
        }

        /* Responsividade básica */
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="welcome-screen">
            <header class="cabecalho">
                <h1 style="color: var(--verde-escuro); margin:0;">Plataforma de Gestão Territorial</h1>
            </header>
            
            <main class="dashboard-container">
                <div class="dashboard-grid">
                    <div class="market-card">Boi Gordo: <span id="val-boi">...</span></div>
                    <div class="market-card">Soja: <span id="val-soja">...</span></div>
                    <div class="market-card">Clima: <span id="val-clima">...</span></div>
                </div>
            </main>

            <footer class="footer">Desenvolvido por Montijo &copy; 2026</footer>
        </div>

        <div id="map-wrapper">
            <header class="cabecalho">
                <h2 style="cursor:pointer; color: var(--verde-escuro);" onclick="retornarParaHome()">Plataforma de Gestão Territorial</h2>
                <nav>
                    <button onclick="entrarNoMapa()">Abrir Mapa</button>
                </nav>
            </header>
            <div id="map"></div>
        </div>
    </div>

    <script>
        // Lógica de navegação
        function entrarNoMapa() {
            document.getElementById('welcome-screen').classList.add('hidden');
            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        function retornarParaHome() {
            document.getElementById('welcome-screen').classList.remove('hidden');
        }

        // Inicialização básica do mapa (exemplo)
        var map = L.map('map').setView([-13.67, -57.89], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    </script>

    <script src="js/leaflet.js"></script>
</body>
</html>
