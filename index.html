<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Painel Interativo Coprodia</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="css/leaflet.css?v=3.0">
    <link rel="stylesheet" href="css/qgis2web.css?v=3.0">
    
    <style>
        :root {
            --verde-escuro: #0f6c37;
            --verde-claro: #5cb85c;
            --amarelo-ouro: #f8cc23;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(15, 108, 55, 0.2);
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f4; display: flex; flex-direction: column; overflow: hidden; }

        /* --- TELA DE BOAS-VINDAS / PÁGINA INICIAL --- */
        #welcome-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('fundo-coprodia.png') no-repeat center center; background-size: cover; z-index: 9999; display: flex; flex-direction: column; justify-content: space-between; align-items: center; transition: opacity 0.4s ease, visibility 0.4s ease; box-sizing: border-box; padding-top: 100px; padding-bottom: 60px; }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* --- DASHBOARD --- */
        .dashboard-container { width: 85%; max-width: 1100px; margin: 0 auto; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; width: 100%; }
        .market-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08); cursor: pointer; transition: transform 0.2s; }
        .card-label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 4px; }
        .card-value { font-size: 16px; font-weight: 700; color: var(--verde-escuro); }
        .card-variation { font-size: 11px; font-weight: 600; }
        .up { color: #2e7d32; } .down { color: #c62828; }
        .weather-card { background: rgba(15, 108, 55, 0.9) !important; color: white; cursor: default; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="dashboard-container">
            <div class="dashboard-grid">
                <div class="market-card"><div class="card-label">Boi Gordo</div><div class="card-value" id="val-boi">--</div><div class="card-variation">--</div></div>
                <div class="market-card"><div class="card-label">Soja</div><div class="card-value" id="val-soja">--</div><div class="card-variation">--</div></div>
                <div class="market-card"><div class="card-label">Milho</div><div class="card-value" id="val-milho">--</div><div class="card-variation">--</div></div>
                <div class="market-card"><div class="card-label">Algodão</div><div class="card-value" id="val-algodao">--</div><div class="card-variation">--</div></div>
                <div class="market-card" onclick="abrirDashboardGrafico()">
                    <div class="card-label">Dólar Comercial</div>
                    <div class="card-value" id="val-dolar">Carregando...</div>
                    <div class="card-variation" id="var-dolar">--</div>
                </div>
                <div class="market-card weather-card"><div class="card-label">Clima</div><div class="card-value" id="val-clima">--</div></div>
            </div>
        </div>
    </div>

    <div id="modal-dolar" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:white; padding:20px; border-radius:15px; text-align:center; max-width: 600px; width: 90%;">
            <h3 style="color: #0f6c37;">Histórico Dólar (30 Dias)</h3>
            <div style="width: 100%; height: 300px;"><canvas id="graficoDolar"></canvas></div>
            <button onclick="document.getElementById('modal-dolar').style.display='none'" style="margin-top:20px; padding:10px 20px; background:#0f6c37; color:white; border:none; border-radius:5px; cursor:pointer;">Fechar</button>
        </div>
    </div>

    <script>
        let chartDolar = null;

        // 1. Busca cotação ATUAL para o card
        async function buscarDolarAtual() {
            try {
                const res = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
                const data = await res.json();
                const dolar = data.USDBRL;
                document.getElementById('val-dolar').innerText = `R$ ${parseFloat(dolar.bid).toFixed(2)}`;
                document.getElementById('var-dolar').innerText = `${dolar.pctChange}%`;
            } catch (e) { console.error("Erro Dólar", e); }
        }

        // 2. Busca histórico para o gráfico
        async function abrirDashboardGrafico() {
            document.getElementById('modal-dolar').style.display = 'flex';
            const res = await fetch('https://economia.awesomeapi.com.br/json/daily/USD-BRL/30');
            const dados = await res.json();
            const labels = dados.map(d => new Date(d.timestamp * 1000).toLocaleDateString('pt-BR')).reverse();
            const valores = dados.map(d => parseFloat(d.bid)).reverse();

            const ctx = document.getElementById('graficoDolar').getContext('2d');
            if (chartDolar) chartDolar.destroy();
            chartDolar = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ label: 'Cotação R$', data: valores, borderColor: '#0f6c37', fill: true }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Inicialização
        window.onload = () => {
            buscarDolarAtual();
            // ... aqui você coloca suas outras funções de clima/agro
        };
    </script>
</body>
</html>
