<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Painel Interativo Coprodia</title>

    <style>
        :root {
            --verde-escuro: #0f6c37;
            --verde-claro: #5cb85c;
            --amarelo-ouro: #f8cc23;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TELA DE BOAS-VINDAS / PÁGINA INICIAL (SPLASH SCREEN) --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.50)), url('fundo-coprodia.png') no-repeat center center;
            background-size: cover;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            box-sizing: border-box;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* --- CABEÇALHO PADRONIZADO (20% DE TRANSPARÊNCIA) --- */
        .site-header {
            background-color: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(5px); 
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--verde-escuro);
            width: 100%;
            z-index: 2000;
            box-sizing: border-box;
        }

        #welcome-screen .site-header {
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-container img {
            height: 90px; 
            display: block;
            width: auto;
        }

        .header-title {
            font-size: 1.8rem; 
            font-weight: 700;
            color: #ffffff; 
            margin: 0;
            white-space: nowrap;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }

        .map-active .header-title {
            color: var(--verde-escuro);
            text-shadow: none;
        }

            display: flex;
            gap: 15px;
            align-items: center;
        }
