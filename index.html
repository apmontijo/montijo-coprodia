<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Plataforma de Gestão Territorial</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/leaflet.css?v=3.0">
    <link rel="stylesheet" href="css/qgis2web.css?v=3.0">
    
    <style>
        :root { --verde-escuro: #0f6c37; --amarelo-ouro: #f8cc23; --glass-bg: rgba(255, 255, 255, 0.9); }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #f4f6f4; }

        /* --- TELA DE BOAS-VINDAS --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* Container que enquadra a imagem entre cabeçalho e rodapé */
        #hero-background {
            flex: 1;
            width: 100%;
            background: url('Site_Montijo_Fundo.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        /* --- CABEÇALHO PADRÃO --- */
        .cabecalho-padrao, #main-header {
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--verde-escuro) !important; 
            width: 100%;
            z-index: 2000;
            box-sizing: border-box;
            background: rgba(235, 247, 235, 0.95) !important;
        }

        .header-title { font-size: 2.5rem !important; font-weight: 700; color: var(--verde-escuro) !important; margin: 0; cursor: pointer; }

        /* --- BOTÕES --- */
        .filter-menu { display: flex; gap: 15px; align-items: center; }
        .filter-btn {
            background-color: rgba(255, 255, 255, 0.95) !important;
            border: 2px solid var(--verde-escuro) !important;
            color: var(--verde-escuro) !important;
            border-radius: 30px !important;
            cursor: pointer;
            font-size: 0.8rem !important; 
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 170px !important;
            height: 40px !important;
        }

        .filter-btn:hover { background-color: var(--verde-escuro) !important; color: white !important; }

        /* --- DASHBOARD --- */
        .dashboard-container { width: 90%; max-width: 1100px; margin: 0 auto 20px auto; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .market-card { background: var(--glass-bg); border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .card-label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; }
        .card-value { font-size: 16px; font-weight: 700; color: var(--verde-escuro); margin: 5px 0; }
        .up { color: #2e7d32; font-size: 11px; }
        .down { color: #c62828; font-size: 11px; }

        /* --- MAPA --- */
        .map-container { flex: 1; display: none; position: relative; }
        .map-active .map-container { display: flex !important; }
        #map { width: 100%; height: 100%; }

        /* --- RODAPÉ --- */
        .corporate-footer {
            background-color: rgba(0, 0, 0, 0.7) !important; 
            color: white !important; 
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
        }

        /* COMPATIBILIDADE MOBILE */
        @media (max-width: 992px) {
            .dashboard-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <header class="cabecalho-padrao">
            <h1 class="header-title" onclick="retornarParaHome()">Plataforma de Gestão Territorial</h1>
            <nav class="filter-menu">
                <button class="filter-btn" onclick="retornarParaHome()">Home</button>
                <button class="filter-btn" onclick="entrarNoMapa('agricola')">Agrícola</button>
                <button class="filter-btn" onclick="entrarNoMapa('confinamento')">Confinamento</button>
            </nav>
        </header>

        <div id="hero-background">
            <div class="dashboard-container">
                <div class="dashboard-grid">
                    <div class="market-card"><div class="card-label">Boi Gordo</div><div class="card-value" id="val-boi">R$ 282,50</div><div class="up">▲ 0.45%</div></div>
                    <div class="market-card"><div class="card-label">Soja</div><div class="card-value" id="val-soja">R$ 134,20</div><div class="down">▼ 0.12%</div></div>
                    <div class="market-card"><div class="card-label">Milho</div><div class="card-value" id="val-milho">R$ 58,90</div><div class="up">▲ 1.15%</div></div>
                    <div class="market-card"><div class="card-label">Algodão</div><div class="card-value" id="val-algodao">R$ 142,15</div><div class="down">▼ 0.32%</div></div>
                    <div class="market-card"><div class="card-label">Dólar</div><div class="card-value" id="val-dolar">R$ 5,25</div><div class="up">▲ 0.10%</div></div>
                    <div class="market-card"><div class="card-label">Clima</div><div class="card-value">28°C</div><div class="up">Céu Limpo</div></div>
                </div>
            </div>
        </div>

        <footer class="corporate-footer">
            Desenvolvido por Montijo - Agricultura de Precisão e Topografia &copy; 2026.
        </footer>
    </div>

    <!-- Estrutura do Mapa -->
    <div class="map-container">
        <div id="map"></div>
    </div>

    <script src="js/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-13.67, -57.89], 13);
        L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}').addTo(map);

        function entrarNoMapa(setor) {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.body.classList.add('map-active');
            map.invalidateSize();
        }

        function retornarParaHome() {
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.body.classList.remove('map-active');
        }
    </script>
</body>
</html>
