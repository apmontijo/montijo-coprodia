<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Montijo - Painel Interativo</title>
    <style>
        /* CSS Otimizado para garantir o layout */
        :root { --verde-escuro: #0f6c37; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }

        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('fundo-coprodia.png') no-repeat center center;
            background-size: cover;
            display: grid;
            /* Layout: Cabeçalho, Botões, Espaço, Rodapé */
            grid-template-rows: auto auto 1fr auto; 
            z-index: 9999;
        }

        /* 1. Cabeçalho */
        .top-header { 
            background: rgba(235, 247, 235, 0.95); 
            padding: 20px 40px; 
            border-bottom: 4px solid var(--verde-escuro);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 2. Botões (Ficam logo abaixo da linha verde) */
        .button-bar { 
            background: rgba(255,255,255,0.9); 
            padding: 10px 40px; 
            display: flex; gap: 20px;
        }

        /* 3. Dashboard Central */
        .dashboard-container { padding: 40px; }
        
        /* 4. Rodapé (Fixo no fim da página) */
        .footer-fixed { 
            background: rgba(0,0,0,0.6); color: white; 
            padding: 15px; text-align: center; font-size: 0.8rem;
        }

        #welcome-screen.hidden { display: none; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <header class="top-header">
            <h1 class="header-title" style="color: var(--verde-escuro); margin:0;">Plataforma de Gestão Territorial</h1>
        </header>

        <nav class="button-bar">
            <button onclick="retornarParaHome()">Home</button>
            <button onclick="entrarNoMapa()">Agrícola</button>
            <button onclick="alert('Confinamento')">Confinamento</button>
        </nav>

        <div class="dashboard-container">
            <p style="color: white; font-weight: bold;">Dashboard de Cotações em tempo real...</p>
        </div>

        <footer class="footer-fixed">
            Desenvolvido por Montijo &copy; 2026.
        </footer>
    </div>

    <div id="map" style="display:none; height: 100vh;"></div>

    <script>
        function entrarNoMapa() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('map').style.display = 'block';
        }
        function retornarParaHome() {
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('map').style.display = 'none';
        }
    </script>
</body>
</html>
