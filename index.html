<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Painel Interativo Coprodia</title>
    
    <link rel="stylesheet" href="css/leaflet.css?v=3.0">
    <link rel="stylesheet" href="css/qgis2web.css?v=3.0">
    
    <style>
        :root {
            --verde-escuro: #0f6c37;
            --verde-claro: #5cb85c;
            --amarelo-ouro: #f8cc23;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(15, 108, 55, 0.2);
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #f4f6f4; overflow: hidden; }

        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('fundo-coprodia.png') no-repeat center center;
            background-size: cover; z-index: 9999; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; padding: 100px 0 60px 0;
        }

        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .cabecalho-padrao {
            position: absolute; top: 0; left: 0; padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 4px solid var(--verde-escuro); width: 100%; z-index: 2000;
        }

        .header-title { font-size: 2.5rem; color: var(--verde-escuro); margin: 0; cursor: pointer; }

        .dashboard-container { width: 85%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }

        .market-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.08); transition: 0.3s; }
        .market-card:hover { transform: translateY(-3px); border-color: var(--verde-escuro); cursor: pointer; }
        
        .card-label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 4px; }
        .card-value { font-size: 16px; font-weight: 700; color: var(--verde-escuro); margin: 2px 0; }
        .card-variation { font-size: 11px; font-weight: 600; }
        .up { color: #2e7d32; }
        .down { color: #c62828; }

        .map-container { flex: 1; display: none; width: 100%; height: 100%; }
        .map-active .map-container { display: flex; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <header class="cabecalho-padrao">
            <h1 class="header-title" onclick="retornarParaHome()">Plataforma de Gestão Territorial</h1>
        </header>

        <div class="dashboard-container">
            <div class="dashboard-grid">
                <div class="market-card"><div class="card-label">Boi Gordo (@)</div><div class="card-value" id="val-boi">R$ 282,50</div><div class="card-variation up">▲ 0.45%</div></div>
                <div class="market-card"><div class="card-label">Soja (sc)</div><div class="card-value" id="val-soja">R$ 134,20</div><div class="card-variation down">▼ 0.12%</div></div>
                <div class="market-card"><div class="card-label">Milho (sc)</div><div class="card-value" id="val-milho">R$ 58,90</div><div class="card-variation up">▲ 1.15%</div></div>
                <div class="market-card"><div class="card-label">Algodão</div><div class="card-value" id="val-algodao">R$ 142,15</div><div class="card-variation down">▼ 0.32%</div></div>
                <div class="market-card" id="card-dolar">
                    <div class="card-label">Dólar Comercial</div>
                    <div class="card-value" id="val-dolar">R$ 5,15</div>
                    <div class="card-variation">Ver Gráfico</div>
                </div>
                <div class="market-card"><div class="card-label">Clima C. Novo</div><div class="card-value" id="val-clima">--°C</div></div>
            </div>
        </div>
    </div>

  <div id="modal-dolar" style="display:none; ...">
    <div style="...">
        <h3>Histórico Dólar Comercial</h3>
        <div id="tradingview-container" style="width: 100%; height: 300px;"></div>
        <button onclick="document.getElementById('modal-dolar').style.display='none'">Fechar</button>
    </div>
</div>

  // No seu <script>, substitua a função de abertura:
function abrirGraficoDolar() {
    // 1. Abre o modal
    const modal = document.getElementById('modal-dolar');
    modal.style.display = 'flex';

    // 2. Garante que o container exista e esteja limpo
    const container = document.getElementById('tradingview-container');
    container.innerHTML = ""; // Limpa tentativas anteriores

    // 3. Cria o Widget
    new TradingView.widget({
        "container_id": "tradingview-container",
        "symbol": "FX_IDC:USDBRL", // Tente usar este código de símbolo específico
        "interval": "D",
        "theme": "light",
        "style": "1",
        "locale": "br",
        "width": "100%",
        "height": "100%"
    });
}

        document.getElementById('card-dolar').onclick = abrirGraficoDolar;

        function retornarParaHome() {
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.body.classList.remove('map-active');
        }
    </script>
</body>
</html>
