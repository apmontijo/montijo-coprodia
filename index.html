<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Painel Interativo Coprodia</title>
    
    <link rel="stylesheet" href="css/leaflet.css?v=2.0">
    <link rel="stylesheet" href="css/qgis2web.css?v=2.0">
    
    <style>
        :root { --verde-escuro: #0f6c37; --verde-claro: #5cb85c; --amarelo-ouro: #f8cc23; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #f4f6f4; display: flex; flex-direction: column; overflow: hidden; }

        /* --- TELA DE BOAS-VINDAS --- */
        #welcome-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('fundo-coprodia.png') no-repeat center center; background-size: cover; z-index: 9999; display: flex; flex-direction: column; justify-content: space-between; transition: opacity 0.4s ease; }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* --- DASHBOARD GRID (NOVO) --- */
        .dashboard-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; width: 85%; margin: auto; }
        .card { background: rgba(255,255,255,0.85); backdrop-filter: blur(5px); padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--verde-escuro); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .label { display: block; font-size: 0.75rem; color: #444; font-weight: bold; text-transform: uppercase; }
        .value { display: block; font-size: 1.3rem; font-weight: 800; color: var(--verde-escuro); margin-top: 5px; }

        /* --- CABEÇALHOS E MAPA (SEU CSS ORIGINAL MANTIDO) --- */
        .cabecalho-padrao, #main-header { padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--verde-escuro); width: 100%; box-sizing: border-box; background: rgba(235, 247, 235, 0.95); }
        .header-title { font-size: 2.5rem; color: var(--verde-escuro); margin: 0; cursor: pointer; }
        .filter-menu { display: flex; gap: 15px; }
        .filter-btn { background: white; border: 2px solid var(--verde-escuro); color: var(--verde-escuro); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; }
        
        .map-container { flex: 1; display: none; position: relative; }
        .map-active .map-container { display: flex; }
        #map { width: 100%; height: 100%; }
        
        .custom-popup-header { background-color: var(--verde-escuro); color: white; padding: 10px; text-align: center; font-weight: bold; }
        .custom-popup-table { width: 100%; border-collapse: collapse; }
        .popup-label { font-weight: bold; padding: 5px; }
        .popup-value { text-align: right; padding: 5px; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <header class="cabecalho-padrao">
            <h1 class="header-title" onclick="retornarParaHome()">Plataforma de Gestão Territorial</h1>
            <nav class="filter-menu">
                <button class="filter-btn" onclick="retornarParaHome()">Home</button>
                <button class="filter-btn" onclick="entrarNoMapa('agricola')">Agrícola</button>
                <button class="filter-btn" onclick="entrarNoMapa('confinamento')">Confinamento</button>
            </nav>
        </header>

        <div class="dashboard-container">
            <div class="card"><span class="label">Boi Gordo</span><span class="value" id="val-boi">R$ 282,50</span></div>
            <div class="card"><span class="label">Soja (sc)</span><span class="value" id="val-soja">R$ 134,20</span></div>
            <div class="card"><span class="label">Milho (sc)</span><span class="value" id="val-milho">R$ 58,90</span></div>
            <div class="card"><span class="label">Algodão</span><span class="value" id="val-algodao">R$ 142,15</span></div>
            <div class="card"><span class="label">Dólar</span><span class="value" id="val-dolar">R$ 5,19</span></div>
            <div class="card"><span class="label">Clima</span><span class="value" id="val-clima">29°C</span></div>
        </div>

        <footer class="corporate-footer"><p>Desenvolvido por Montijo &copy; 2026.</p></footer>
    </div>

    <header id="main-header">
        <h1 class="header-title" onclick="retornarParaHome()">Plataforma de Gestão Territorial</h1>
    </header>

    <div class="map-container">
        <div id="map"></div>
    </div>

    <script src="js/leaflet.js"></script>
    <script>
        // Lógica de PopUp e Mapa (Mantida do seu original)
        function configurarPopUp(feature, layer) {
            var props = feature.properties;
            var html = '<div class="custom-popup-header">' + (props.NOME || 'Talhão') + '</div>';
            html += '<table class="custom-popup-table">';
            ['AREA', 'TALHAO'].forEach(function(c) {
                if(props[c]) html += '<tr><td class="popup-label">'+c+':</td><td class="popup-value">'+props[c]+'</td></tr>';
            });
            html += '</table>';
            layer.bindPopup(html, {className: 'custom-popup'});
        }

        // Funções de navegação
        function entrarNoMapa(setor) {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.body.classList.add('map-active');
            map.invalidateSize();
        }
        function retornarParaHome() {
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.body.classList.remove('map-active');
        }
    </script>
</body>
</html>
