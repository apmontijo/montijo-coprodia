<html lang="pt-BR">

    <style>
        :root {
            --verde-escuro: #0f6c37;
            --verde-claro: #5cb85c;
            --amarelo-ouro: #f8cc23;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TELA DE BOAS-VINDAS / PÁGINA INICIAL (SPLASH SCREEN) --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fundo-coprodia.png') no-repeat center center;
            background-size: cover;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            box-sizing: border-box;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- CABEÇALHO PADRONIZADO (FUNDO PRETO 35% TRANSPARENTE) --- */
        .cabecalho-padrao {
            background: rgba(0, 0, 0, 0.35) !important; 
            backdrop-filter: none !important; 
            -webkit-backdrop-filter: none !important;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--verde-escuro) !important; 
            width: 100%;
            z-index: 2000;
            box-sizing: border-box;
        }

        #welcome-screen .cabecalho-padrao {
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
        }

        .header-title {
            font-size: 2.5rem !important; 
            font-weight: 700;
            color: #ffffff !important; 
            margin: 0;
            white-space: nowrap;
            text-shadow: none !important; 
            cursor: pointer !important; 
        }

            align-items: center;
