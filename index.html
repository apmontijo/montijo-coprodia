<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Plataforma de Gestão Territorial</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/leaflet.css?v=3.0">
    <link rel="stylesheet" href="css/qgis2web.css?v=3.0">
    
    <style>
        :root { --verde-escuro: #0f6c37; --amarelo-ouro: #f8cc23; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: #f4f6f4; display: flex; flex-direction: column; overflow: hidden; }

        /* Cabeçalho */
        #main-header {
            background: #ffffff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--verde-escuro);
            z-index: 2000;
        }

        .header-title { font-size: 1.5rem; font-weight: 700; color: var(--verde-escuro); margin: 0; }

        .filter-menu { display: flex; gap: 15px; }
        .filter-btn { background: white; border: 1px solid var(--verde-escuro); color: var(--verde-escuro); padding: 8px 15px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .filter-btn:hover { background: var(--verde-escuro); color: white; }

        /* Dashboard */
        .dashboard-container { flex: 1; padding: 20px; overflow-y: auto; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; }
        .market-card { background: white; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #ddd; }

        /* Rodapé */
        .corporate-footer { background: #0f6c37; color: white; padding: 10px; text-align: center; font-size: 0.8rem; }

        /* Mapa */
        .map-container { flex: 1; display: none; position: relative; }
        .map-active .map-container { display: flex; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header id="main-header">
        <h1 class="header-title">Plataforma de Gestão Territorial</h1>
        <nav class="filter-menu">
            <button class="filter-btn" onclick="retornarParaHome()">Home</button>
            <button class="filter-btn" onclick="entrarNoMapa()">Agrícola</button>
            <button class="filter-btn">Confinamento</button>
        </nav>
    </header>

    <div class="dashboard-container">
        <!-- Conteúdo do Painel Principal (Inserir aqui a imagem de fundo que você deseja manter conforme o layout) -->
        <div class="dashboard-grid">
            <!-- Cards de cotações mantidos conforme lógica anterior -->
        </div>
    </div>

    <footer class="corporate-footer">
        <p>Desenvolvido por Montijo - Agricultura de Precisão e Topografia &copy; 2026. Todos os direitos reservados.</p>
    </footer>

    <div class="map-container">
        <div id="map"></div>
    </div>

    <script>
        function entrarNoMapa() {
            document.body.classList.add('map-active');
            document.querySelector('.dashboard-container').style.display = 'none';
        }
        function retornarParaHome() {
            document.body.classList.remove('map-active');
            document.querySelector('.dashboard-container').style.display = 'block';
        }
    </script>
</body>
</html>
