<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montijo - Painel Interativo Coprodia</title>
    
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    
    <style>
        :root {
            --verde-escuro: #0f6c37;
            --verde-claro: #5cb85c;
            --amarelo-ouro: #f8cc23;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TELA DE BOAS-VINDAS / PÁGINA INICIAL (SPLASH SCREEN) --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fundo-coprodia.png') no-repeat center center;
            background-size: cover;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            box-sizing: border-box;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* --- CABEÇALHO SEM BACKGROUND (APENAS A LINHA VERDE SEPARADORA) --- */
        .site-header {
            background: transparent !important; /* Força a remoção de qualquer cor de fundo */
            background-color: transparent !important;
            backdrop-filter: none !important; /* Remove o desfoque antigo */
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--verde-escuro); /* Apenas a linha verde separando */
            width: 100%;
            z-index: 2000;
            box-sizing: border-box;
        }

        #welcome-screen .site-header {
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
        }

        /* TÍTULO CORRIGIDO: Fonte reduzida e super destaque com sombra verde Coprodia */
        .header-title {
            font-size: 2.5rem !important; /* Reduzido o tamanho da fonte */
            font-weight: 700;
            color: #ffffff; 
            margin: 0;
            white-space: nowrap;
            /* Sombra reforçada em múltiplos ângulos com o verde oficial para máxima leitura */
            text-shadow: 
                3px 3px 0px var(--verde-escuro),
                -1px -1px 0px var(--verde-escuro),  
                 1px -1px 0px var(--verde-escuro),
                -1px  1px 0px var(--verde-escuro),
                 1px  1px 0px var(--verde-escuro),
                 0px  3px 5px rgba(0, 0, 0, 0.5);
        }

        .map-active .header-title {
            color: #ffffff;
        }

        .filter-menu {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-btn {
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--verde-escuro);
            color: var(--verde-escuro);
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .filter-btn:hover {
            background-color: var(--verde-escuro);
            color: white;
            transform: translateY(-2px);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* --- MAP CONTAINER --- */
        .map-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            z-index: 1000;
        }

        /* --- RODAPÉ CORPORATIVO --- */
        .corporate-footer {
            background-color: rgba(0, 0, 0, 0.45); 
            color: rgba(255, 255, 255, 0.85); 
            padding: 12px 20px;
            text-align: center;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(3px);
        }

        .map-container .corporate-footer,
        #welcome-screen .corporate-footer {
            background-color: rgba(0, 0, 0, 0.45);
            color: rgba(255, 255, 255, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(3px);
            box-shadow: none;
        }

        .footer-text {
            margin: 0;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* --- POP-UP CUSTOMIZADO --- */
        .custom-popup .leaflet-popup-content-wrapper {
            background: #ffffff;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .custom-popup-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            color: #333;
            min-width: 220px;
        }

        .custom-popup-header {
            background-color: var(--verde-escuro);
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            border-radius: 4px 4px 0 0;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .custom-popup-table tr { border-bottom: 1px solid #eaeaea; }
        .custom-popup-table tr:last-child { border-bottom: none; }
        .custom-popup-table td { padding: 6px 8px; }
        .popup-label { font-weight: 700; color: #555; width: 45%; }
        .popup-value { text-align: right; font-weight: 500; color: #111; }

        @media (max-width: 992px) {
            .site-header { flex-direction: column; gap: 15px; padding: 15px; text-align: center; }
            .header-brand { flex-direction: column; gap: 10px; }
            .header-title { font-size: 1.8rem !important; white-space: normal; }
            .filter-menu { width: 100%; justify-content: center; }
            #welcome-screen .site-header { position: relative; }
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <header class="site-header">
            <div class="header-brand">
                <h1 class="header-title">Plataforma de Gestão Territorial</h1>
            </div>

            <nav class="filter-menu">
                <button class="filter-btn" id="btn-agricola-welcome" onclick="entrarNoMapa('agricola')">
                    <img src="cana-vetor.jpg" class="btn-icon" alt="Cana">
                    Agrícola
                </button>

                <button class="filter-btn" id="btn-confinamento-welcome" onclick="entrarNoMapa('confinamento')">
                    <img src="boi-vetor.jpg" class="btn-icon" alt="Boi">
                    Confinamento
                </button>
            </nav>
        </header>

        <div></div> 

        <footer class="corporate-footer">
            <p class="footer-text">Desenvolvido por Montijo - Agricultura de Precisão e Topografia &copy; 2026. Todos os direitos reservados.</p>
        </footer>
    </div>

    <header class="site-header" id="main-header">
        <div class="header-brand">
            <h1 class="header-title">Plataforma de Gestão Territorial</h1>
        </div>

        <nav class="filter-menu">
            <button class="filter-btn" id="btn-agricola" onclick="alert('Mostrando talhões agrícolas de cana-de-açúcar.')">
                <img src="cana-vetor.jpg" class="btn-icon" alt="Cana">
                Agrícola
            </button>

            <button class="filter-btn" id="btn-confinamento" onclick="alert('Filtrando Confinamento Pecuário...')">
                <img src="boi-vetor.jpg" class="btn-icon" alt="Boi">
                Confinamento
            </button>
        </nav>
    </header>

    <div class="map-container">
        <div id="map"></div>
        
        <footer class="corporate-footer">
            <p class="footer-text">Desenvolvido por Montijo - Agricultura de Precisão e Topografia &copy; 2026. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/L.Control.Locate.min.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    
    <script src="data/2026_COPRODIA_BASE_1.js"></script>
